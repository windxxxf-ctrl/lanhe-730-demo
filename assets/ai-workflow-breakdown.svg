<svg xmlns="http://www.w3.org/2000/svg" width="1336" height="720" viewBox="52 46 1336 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#e8f3ff"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1762ad"/>
      <stop offset="1" stop-color="#2d7dcc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#0b3a73" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1440" height="820" rx="34" fill="url(#bg)"/>
  <path d="M86 126H1354M86 242H1354M86 358H1354M86 474H1354M86 590H1354" stroke="#d8eafc" stroke-width="1"/>
  <path d="M230 54V766M430 54V766M630 54V766M830 54V766M1030 54V766M1230 54V766" stroke="#e2f0fd" stroke-width="1"/>
  <circle cx="1190" cy="140" r="106" fill="none" stroke="#c6def6" stroke-width="4" opacity=".7"/>

  <rect x="52" y="46" width="1336" height="720" rx="26" fill="#ffffff" filter="url(#shadow)"/>
  <rect x="52" y="46" width="1336" height="70" rx="26" fill="#f0f7ff"/>
  <circle cx="98" cy="82" r="9" fill="#ef6b6b"/>
  <circle cx="132" cy="82" r="9" fill="#f5c04e"/>
  <circle cx="166" cy="82" r="9" fill="#3bb273"/>
  <text x="212" y="93" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="28" font-weight="800" fill="#0b356c">Codex 自动化拆解示例</text>

  <rect x="94" y="132" width="350" height="548" rx="18" fill="#f7fbff" stroke="#c8def5" stroke-width="2"/>
  <text x="124" y="185" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="29" font-weight="800" fill="#0b356c">我给 AI 的原始流程</text>
  <text x="124" y="234" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="23" fill="#173a65">
    <tspan x="124" dy="0">现在人工需要：</tspan>
    <tspan x="124" dy="38">复制订单信息，整理字段，</tspan>
    <tspan x="124" dy="38">查询 SKU 和条码，</tspan>
    <tspan x="124" dy="38">核对物料编码，</tspan>
    <tspan x="124" dy="38">再填导单表，</tspan>
    <tspan x="124" dy="38">最后导入吉客云。</tspan>
  </text>
  <text x="124" y="482" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="23" fill="#173a65">
    <tspan x="124" dy="0">请判断能不能自动化？</tspan>
    <tspan x="124" dy="38">如果可以，应该怎么拆模块，</tspan>
    <tspan x="124" dy="38">先做哪一步最稳？</tspan>
  </text>
  <rect x="124" y="588" width="190" height="42" rx="21" fill="url(#blue)"/>
  <text x="153" y="616" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="21" font-weight="800" fill="#fff">问题先讲清楚</text>

  <path d="M468 406H532" stroke="#2d7dcc" stroke-width="5" fill="none"/>
  <path d="M516 386L540 406L516 426" stroke="#2d7dcc" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="570" y="132" width="760" height="548" rx="18" fill="#ffffff" stroke="#c8def5" stroke-width="2"/>
  <text x="606" y="185" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="31" font-weight="800" fill="#0b356c">Codex 给出的答复</text>

  <rect x="606" y="212" width="688" height="78" rx="16" fill="#eef6ff"/>
  <text x="636" y="246" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="26" font-weight="800" fill="#0b356c">可以自动化，但不要先模仿人工操作</text>
  <text x="636" y="276" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="20" fill="#426288">最稳的第一步：先固定输入是什么，最终要生成什么格式。</text>

  <g font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif">
    <rect x="606" y="316" width="688" height="56" rx="14" fill="#f7fbff"/>
    <circle cx="638" cy="344" r="16" fill="url(#blue)"/>
    <text x="633" y="353" font-size="20" font-weight="800" fill="#fff">1</text>
    <text x="672" y="352" font-size="23" font-weight="800" fill="#0b356c">读取信息</text>
    <text x="790" y="352" font-size="20" fill="#426288">从剪贴板或电子表格拿到订单内容</text>

    <rect x="606" y="386" width="688" height="56" rx="14" fill="#eef6ff"/>
    <circle cx="638" cy="414" r="16" fill="url(#blue)"/>
    <text x="633" y="423" font-size="20" font-weight="800" fill="#fff">2</text>
    <text x="672" y="422" font-size="23" font-weight="800" fill="#0b356c">整理字段</text>
    <text x="790" y="422" font-size="20" fill="#426288">把订单信息拆成固定字段</text>

    <rect x="606" y="456" width="688" height="56" rx="14" fill="#f7fbff"/>
    <circle cx="638" cy="484" r="16" fill="url(#blue)"/>
    <text x="633" y="493" font-size="20" font-weight="800" fill="#fff">3</text>
    <text x="672" y="492" font-size="23" font-weight="800" fill="#0b356c">匹配规则</text>
    <text x="790" y="492" font-size="20" fill="#426288">用多维表格匹配 SKU 和物料编码</text>

    <rect x="606" y="526" width="688" height="56" rx="14" fill="#eef6ff"/>
    <circle cx="638" cy="554" r="16" fill="url(#blue)"/>
    <text x="633" y="563" font-size="20" font-weight="800" fill="#fff">4</text>
    <text x="672" y="562" font-size="23" font-weight="800" fill="#0b356c">生成结果</text>
    <text x="790" y="562" font-size="20" fill="#426288">写入多维表格，或生成吉客云需要的本地 Excel</text>

    <rect x="606" y="596" width="688" height="56" rx="14" fill="#f7fbff"/>
    <circle cx="638" cy="624" r="16" fill="url(#blue)"/>
    <text x="633" y="633" font-size="20" font-weight="800" fill="#fff">5</text>
    <text x="672" y="632" font-size="23" font-weight="800" fill="#0b356c">交给工具执行</text>
    <text x="828" y="632" font-size="20" fill="#426288">让影刀继续读取数据、导入吉客云</text>
  </g>

  <text x="94" y="724" font-family="Microsoft YaHei, PingFang SC, Arial, sans-serif" font-size="25" font-weight="800" fill="#0b356c">中间路径不一定照搬人工动作，可以让多维表格、AI 和自动化工具协作完成。</text>
</svg>
